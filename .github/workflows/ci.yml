name: CI

on:
  push:
    branches: [main]
  pull_request:

# Mínimo: el token solo necesita leer el repo para correr las pruebas.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      # Versiones fijas con hash (se regenera con: uv pip compile requirements-dev.txt
      # --universal --python-version 3.13 --generate-hashes -o requirements-dev.lock)
      - run: pip install --require-hashes -r requirements-dev.lock
      - run: python -m pytest --ignore=tests/e2e
